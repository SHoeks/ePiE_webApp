<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Email Button Test</title>
	<style>
		:root {
			font-family: Helvetica, Arial, sans-serif;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #f3f4f6;
			color: #111827;
		}

		.card {
			width: min(92vw, 420px);
			background: #ffffff;
			border: 1px solid #d1d5db;
			border-radius: 12px;
			padding: 1.25rem;
			box-shadow: 0 8px 20px rgba(17, 24, 39, 0.08);
			text-align: center;
		}

		h1 {
			margin: 0 0 0.5rem;
			font-size: 1.25rem;
		}

		p {
			margin: 0 0 1rem;
			color: #374151;
		}

		button {
			border: 0;
			border-radius: 10px;
			padding: 0.7rem 1rem;
			font-size: 1rem;
			cursor: pointer;
			background: #2563eb;
			color: #ffffff;
		}

		#status {
			margin-top: 0.75rem;
			font-size: 0.92rem;
			color: #4b5563;
			min-height: 1.2rem;
		}
	</style>
</head>
<body>
	<main class="card">
		<h1>Send Email</h1>
		<p>Click the button to create an email with the current time.</p>
		<button id="sendEmailBtn" type="button">Send Email</button>
		<div id="status" aria-live="polite"></div>
        <button onclick="sendEmail()">Send Email</button>
	</main>


    <script>
    function sendEmail() {
        const now = new Date();
        const dateTime = now.toLocaleString();

        const subject = encodeURIComponent("Button Click Event");
        const body = encodeURIComponent("The button was clicked at: " + dateTime);

        window.location.href =
            `mailto:selwyn.hoeks@ru.nl?subject=${subject}&body=${body}`;
    }
    </script>
</body>
</html>
